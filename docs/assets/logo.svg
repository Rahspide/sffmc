<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="620" height="140" role="img" aria-label="SFFMC">
  <defs>
    <linearGradient id="octFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <style>
      .brand { fill: #0f172a; }
      @media (prefers-color-scheme: dark) {
        .brand { fill: #ffffff; }
      }
    </style>
  </defs>

  <!-- Octagon (8-sided polygon), no background -->
  <polygon points="30,15 105,15 130,40 130,105 105,130 30,130 5,105 5,40"
           fill="none"
           stroke="url(#octFill)"
           stroke-width="6"
           stroke-linejoin="miter"
           stroke-miterlimit="6"/>

  <!-- Big letter S centered inside the octagon -->
  <text class="brand" x="67.5" y="105"
        font-family="-apple-system, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="92"
        font-weight="900"
        text-anchor="middle">S</text>

  <!-- SFFMC wordmark, vertically centered with the octagon -->
  <text class="brand" x="160" y="105"
        font-family="-apple-system, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="92"
        font-weight="900"
        letter-spacing="-4">SFFMC</text>
</svg>